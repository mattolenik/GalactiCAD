<!DOCTYPE html>
<html>
<head>
    <title>GalactiCAD</title>
    <meta charset="UTF-8">
    <meta name="description" content="A new kind of CAD with SDFs, made for 3D printing">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
    <meta name="theme-color" content="#333333">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/vs/editor/editor.main.css" />
    <style>
        html {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overscroll-behavior: none;
        }

        div,
        span {
            margin: 0;
            padding: 0;
        }

        body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #333;
            color: whitesmoke;
            scrollbar-width: none;
            overscroll-behavior: none;
        }

        #preview {
            display: block;
        }

        #viewports {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            touch-action: none;
        }

        #viewports > * {
            min-height: 0;
            flex: 1 1 0;
        }

        preview-window,
        mesh-viewer {
            display: block !important;
            width: 100%;
            height: 100%;
        }

        #toolbar {
            margin: 0;
            padding: 0;
            display: inline-block;
            z-index: 20;
        }

        #log {
            font-size: 1rem;
            margin-bottom: -2rem;
        }

        #editor {
            z-index: 10;
            position: absolute;
            background-color: rgba(30, 30, 30, 0.82);
            overflow: hidden;
            --vscode-focusBorder: transparent;
        }

        #editor::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('/assets/logo1.png') center/cover no-repeat;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: -1;
        }

        #editor.visible::before {
            opacity: 0;
        }

        .monaco-editor {
            opacity: 0.99;
        }
        #editor .monaco-editor,
        #editor .monaco-editor-background,
        #editor .monaco-editor .overflow-guard,
        #editor .monaco-editor .margin {
            background: transparent !important;
        }
        #editor .monaco-editor,
        #editor .monaco-editor:focus,
        #editor .monaco-editor *:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        #toolbar {
            display: grid;
            width: 100%;
            grid-template-columns: 1fr min-content;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        #toolbar > #tabs {
            min-width: 0;
        }

        #workspace {
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 1fr;
            min-width: 400px;
            margin: auto;
        }
        #main-panels {
            position: relative;
            min-height: 0;
            overflow: hidden;
        }
        #workspace:not(.editor-left) #editor {
            top: 0;
            left: 0;
            right: 0;
            height: var(--editor-height, 22%);
        }
        #workspace.editor-left #editor {
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--editor-width, 35%);
        }
        /* Polygon editor replaces the code editor in the same slot */
        #main-panels polygon-editor {
            position: absolute;
            z-index: 10;
            background-color: rgba(30, 30, 30, 0.82);
            overflow: hidden;
        }
        #workspace:not(.editor-left) #main-panels polygon-editor {
            top: 0;
            left: 0;
            right: 0;
            height: var(--editor-height, 22%);
        }
        #workspace.editor-left #main-panels polygon-editor {
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--editor-width, 35%);
        }
        @media only screen and (max-width: 4in) {
            #workspace {
                min-width: 100%;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
        }

        #workspace>* {
            min-width: 0;
        }

        #resize-handle {
            position: absolute;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background: rgba(255, 255, 255, 0.08);
            z-index: 15;
        }
        #workspace:not(.editor-left) #resize-handle {
            cursor: row-resize;
            left: 0;
            right: 0;
            top: var(--editor-height, 22%);
            height: 6px;
        }
        #workspace.editor-left #resize-handle {
            cursor: col-resize;
            top: 0;
            bottom: 0;
            left: var(--editor-width, 35%);
            width: 6px;
        }
        #resize-handle:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        #resize-handle:active {
            background: rgba(255, 255, 255, 0.35);
        }

        input,
        select,
        textarea {
            font-size: 16px;
        }

        canvas {
            /* disable all built-in touch gestures/selection on the element */
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* prevent text selection in editor while dragging resize handle (mobile) */
        body.resize-dragging {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>

<body>
    <div id="workspace">
        <div id="toolbar">
            <div id="tabs"></div>
            <div id="menuButton"></div>
        </div>
        <div id="main-panels">
            <div id="editor"></div>
            <div id="resize-handle" role="separator" aria-orientation="horizontal"></div>
            <div id="viewports">
                <preview-window id="preview"></preview-window>
            </div>
        </div>
        <div id="log"></div>
    </div>
    <script type="module" src="./components/preview-window.js"></script>
    <script type="module">
        import App from './app.js';
        const editor = document.getElementById("editor")
        editor.classList.add("visible")
        const app = new App(
            document.getElementById("preview"),
            document.getElementById("tabs"),
            editor,
            document.getElementById("log"),
            document.getElementById("menuButton"))
    </script>
</body>
</html>
