    - 0.28
    - 0.36
    - 0.12
  pivot:
    - 0
    - 0
    - 0
viewCenter:
  - 0.5
  - 0.5
resolutionScale: 1
viewportWidth: 1200
viewportHeight: 900
meshExport:
  simplifyOnExport: false
  exporter: sfcc
