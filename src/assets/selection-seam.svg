<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Sphere (circle) and cube (parallelogram) intersection - seam curve highlighted -->
  <!-- Cube wireframe (faint) -->
  <g stroke-opacity="0.35" stroke-width="1">
    <polygon points="5,6 11,6 13,11 7,11"/>
    <line x1="11" y1="6" x2="13" y2="11"/>
    <line x1="7" y1="11" x2="5" y2="6"/>
  </g>
  <!-- Sphere outline -->
  <circle cx="9" cy="9" r="5.5" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Seam curve (intersection of sphere and cube) - highlighted -->
  <ellipse cx="9" cy="8.5" rx="3" ry="2" stroke-opacity="0.95" stroke-width="2" fill="none" transform="rotate(-25 9 8.5)"/>
</svg>
