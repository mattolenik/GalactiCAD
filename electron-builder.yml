appId: app.galacticad
productName: GalactiCAD

# Everything generated/used by electron-builder lives under dist/:
#   dist/build    — buildResources (icons rendered from src/assets/gicon.svg
#                   by `make icons`)
#   dist/release  — packaged installers/archives
# Source-only electron files (main.mjs, preload.cjs, entitlements.plist) stay
# in electron/.
directories:
  buildResources: dist/build
  output: dist/release

# Include only what the runtime needs:
#   dist/site  — the built web app loaded over app://galacticad
#   electron/  — main + preload + entitlements
# Every package.json "dependency" is BUILD-time only: esbuild bundles them all into
# dist/site, and neither main.mjs nor preload.cjs require() anything outside node:/
# electron. electron-builder otherwise copies ALL production dependencies into the
# asar (tens of MB of typescript + rxjs + other deps that the runtime never loads),
# so node_modules is excluded explicitly. dist/build and dist/release are excluded too.
files:
  - "electron/**"
  - "dist/site/**"
  - "package.json"
  - "!node_modules/**/*"

asar: true

# Squeeze the distributable installers (.dmg/.zip/.nsis/AppImage) harder. This only
# affects download size — the installed app's asar is uncompressed either way.
compression: maximum

# Force the arch suffix into the .dmg name for EVERY arch. electron-builder
# strips "-${arch}" for the default arch (x64) — but only while artifactName is
# left at its default; setting artifactName explicitly marks the pattern
# "user-forced" and the suffix is kept for all arches. Result:
#   GalactiCAD-<version>-arm64.dmg  /  GalactiCAD-<version>-x64.dmg
# Symmetric names let the Homebrew cask template a single URL by arch.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Sign with the Developer ID Application cert in the login keychain.
  # Hardened runtime + entitlements are required for notarization; the same
  # entitlements must be inherited by Electron's helper apps or the renderer
  # will be killed for using JIT.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  # Notarization is handled by the afterSign hook (electron/notarize.cjs),
  # which calls @electron/notarize with a keychain-stored credential profile
  # instead of env-var Apple ID + app-specific password. One-time setup:
  #   xcrun notarytool store-credentials galacticad-notarytool \
  #       --apple-id ... --team-id ... --password ...
  # The hook also fetches and prints the notary log (Apple recommends always
  # inspecting it). The afterAllArtifactBuild hook additionally staples the
  # .dmg containers themselves so Gatekeeper can validate them offline.
  # Skip signing + notarization locally with CSC_IDENTITY_AUTO_DISCOVERY=false.
  notarize: false

afterSign: electron/notarize.cjs
afterAllArtifactBuild: electron/staple-dmg.cjs

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

linux:
  category: Graphics
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
