source: "// Extrude, Loft & Lathe Demo\r\n// Demonstrates 2D polygon extrusion, lofting, and revolution\r\n\r\n// === EXTRUDE: Triangle ===\r\nlet tri = polygon2d([[-5, -3], [-3.88, -3.65], [1.66, -3.73], [3.2, -2.99], [2.73, -1.12], [0.74, 2.98], [-0.35, 3.51], [-1.49, 3.16], [-4.28, -1.77]])\r\nlet extrudedTri = extrude.profile(tri).height(6.464).shift([0, -3.147, 0])\r\n\r\n// === EXTRUDE: L-shaped profile with position offset ===\r\nlet lShape = polygon2d([[-3, -3], [3, -3], [3, -1], [-1, -1], [-1, 3], [-3, 3]])\r\nlet extrudedL = extrude.profile(lShape).height(9.84).twist(500).shift([20, 4.84, 0])\r\n\r\n// === EXTRUDE with TWIST: Star twisted 180° ===\r\nlet star = polygon2d([\r\n  [0, 4],\r\n  [4.66, 4.94],\r\n  [4, 1.2],\r\n  [3.06, -0.97],\r\n  [2.5, -3.5],\r\n  [-0.16, -2.82],\r\n  [-1.57, -3.19],\r\n  [-1.52, -1.73],\r\n  [0.23, -0.04],\r\n  [-0.69, 2.27],\r\n])\r\nlet twistedStar = extrude.profile(star).height(6.256).twist(90).shift([40, -1.744, 0])\r\n\r\n// === LOFT: Square to triangle ===\r\nlet square = polygon2d([[-4, -4], [4, -4], [4, 4], [-4, 4]])\r\nlet triangle = polygon2d([[-2, -2], [2, -2], [0, 3]])\r\nlet lofted = loft.sections([square, triangle]).height(8.231).shift([0, 0.231, -20])\r\n\r\n// === LATHE: Vase ===\r\n// Profile is in (radius, height) space — revolved around Y axis\r\nlet vaseProfile = polygon2d([\r\n  [1.27, -4.97],\r\n  [3, -5],\r\n  [5.42, -4.45],\r\n  [5.19, -3.56],\r\n  [4.38, -2.83],\r\n  [6.07, -2.11],\r\n  [4.82, -1.08],\r\n  [5.42, -0.34],\r\n  [5.88, 0.07],\r\n  [3.91, 1.45],\r\n  [4.47, 2.77],\r\n  [2.07, 3.07],\r\n  [0.93, 0.05],\r\n])\r\nlet vase = lathe.profile(vaseProfile).shift([-20, 0, 0])\r\n\r\nlet sph = sphere.radius(10).shift([0,0,18])\r\n\r\n// === ASSEMBLY ===\r\nreturn union(\r\n  extrudedTri,\r\n  extrudedL,\r\n  twistedStar,\r\n  lofted,\r\n  sph,\r\n  vase,\r\n)\r\n// return sph\r\n"
