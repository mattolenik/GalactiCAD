<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Isometric cube wireframe - all 12 edges visible -->
  <!-- Front face -->
  <polygon points="9,3 15,7 9,10 3,7"/>
  <!-- Back edges -->
  <line x1="15" y1="7" x2="15" y2="14"/>
  <line x1="15" y1="14" x2="9" y2="17"/>
  <line x1="9" y1="17" x2="3" y2="14"/>
  <line x1="3" y1="14" x2="3" y2="7"/>
  <!-- Vertical edges from front to back -->
  <line x1="9" y1="10" x2="9" y2="17"/>
  <line x1="15" y1="7" x2="15" y2="14"/>
  <line x1="3" y1="7" x2="3" y2="14"/>
</svg>
