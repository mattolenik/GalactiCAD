<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>galacticad remote</title>
<style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; overscroll-behavior: none; }
    /* No 100vh: on iOS Safari / Android Chrome it includes the area under the browser
       toolbar, so the canvas ran past the visible bottom (frame stretched, bottom strip
       hidden, taps landing low). The script sizes it from window.innerWidth/innerHeight,
       which is also exactly what the remote tab's viewport is set to — 1:1, no scaling. */
    #view {
        position: fixed; top: 0; left: 0; display: block;
        touch-action: none; user-select: none; -webkit-user-select: none; cursor: default; outline: none;
        image-rendering: auto;
    }
    #kb {
        position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0.01; border: 0; padding: 0; resize: none;
        font-size: 16px; /* ≥16px stops iOS from zooming the page on focus */
    }
    /* Bottom-center: the app's own toolbar lives top-right and its hover readout bottom-left,
       and the HUD swallows pointer events, so it must not sit over either. */
    #hud {
        position: fixed; bottom: max(6px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 2;
        display: flex; gap: 6px; align-items: center;
        font: 12px/1 system-ui, sans-serif; color: #ddd;
        opacity: 0.85; transition: opacity 0.3s;
    }
    #hud.faded { opacity: 0.15; }
    #hud span, #hud button {
        background: rgba(20, 20, 20, 0.75); border: 1px solid #444; border-radius: 6px; padding: 5px 8px; color: #ddd;
    }
    #hud button { cursor: pointer; }
    #hud button.on { border-color: #6a6; color: #cfc; }
    #status.err { color: #f88; }
    #banner {
        position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
        font: 15px system-ui, sans-serif; color: #999;
    }
    #banner.hidden { display: none; }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<textarea id="kb" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true"></textarea>
<div id="banner">connecting…</div>
<div id="hud">
    <span id="status">…</span>
    <button id="btnKb" title="Show on-screen keyboard">⌨</button>
    <button id="btnHidpi" title="Render the remote tab at 2× device pixel ratio (sharper, slower)">HiDPI</button>
    <button id="btnReload" title="Reload the remote tab">↻</button>
    <button id="btnFs" title="Fullscreen">⛶</button>
</div>
<script>
(() => {
    const canvas = document.getElementById("view")
    const ctx = canvas.getContext("2d", { alpha: false })
    const kb = document.getElementById("kb")
    const hud = document.getElementById("hud")
    const statusEl = document.getElementById("status")
    const banner = document.getElementById("banner")
    const btnHidpi = document.getElementById("btnHidpi")

    const token = new URLSearchParams(location.search).get("token")
    const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/_remote/ws${token ? `?token=${encodeURIComponent(token)}` : ""}`

    let ws = null
    let open = false
    let reconnectDelay = 500
    let hidpi = false
    try { hidpi = localStorage.getItem("gcad_remote_hidpi") === "1" } catch {}
    btnHidpi.classList.toggle("on", hidpi)

    // ── status / hud ──
    let frames = 0, fps = 0
    let activeTouches = 0 // live finger count, shown in the HUD so on-device gesture detection is visible
    setInterval(() => { fps = frames; frames = 0; renderStatus() }, 1000)
    let remoteState = { status: "idle", message: "" }
    function renderStatus() {
        const s = remoteState.status
        statusEl.classList.toggle("err", s === "error")
        const touchInfo = activeTouches > 0 ? ` · ${activeTouches} touch${activeTouches > 1 ? "es" : ""}` : ""
        statusEl.textContent = !open ? "disconnected" : s === "ready" ? `${fps} fps · ${canvas.width}×${canvas.height}${touchInfo}` : s === "launching" ? "launching browser…" : s === "error" ? `error: ${remoteState.message || ""}` : s
        const showBanner = !open || s !== "ready"
        banner.classList.toggle("hidden", !showBanner)
        if (showBanner) banner.textContent = !open ? "connecting…" : s === "launching" ? "launching headless browser…" : s === "error" ? `error: ${remoteState.message || ""}` : "waiting for first frame…"
    }
    let hudTimer = null
    function pokeHud() {
        hud.classList.remove("faded")
        clearTimeout(hudTimer)
        hudTimer = setTimeout(() => hud.classList.add("faded"), 2500)
    }
    pokeHud()

    // ── frames ──
    let decoding = false
    let latestBlob = null
    async function drawLoop() {
        if (decoding) return
        decoding = true
        try {
            while (latestBlob) {
                const blob = latestBlob
                latestBlob = null
                let bmp
                try { bmp = await createImageBitmap(blob) } catch { continue }
                if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
                    canvas.width = bmp.width
                    canvas.height = bmp.height
                }
                ctx.drawImage(bmp, 0, 0)
                bmp.close()
                frames++
                if (!banner.classList.contains("hidden") && remoteState.status === "ready") banner.classList.add("hidden")
            }
        } finally {
            decoding = false
        }
    }

    // ── connection ──
    function send(obj) {
        if (open) {
            try { ws.send(JSON.stringify(obj)) } catch {}
        }
    }
    function viewportSize() {
        return { w: Math.round(window.innerWidth), h: Math.round(window.innerHeight) }
    }
    function fitCanvas() {
        const { w, h } = viewportSize()
        canvas.style.width = `${w}px`
        canvas.style.height = `${h}px`
    }
    fitCanvas()
    function viewportMsg(t) {
        const { w, h } = viewportSize()
        return { t, w, h, dpr: hidpi ? 2 : 1, touch: navigator.maxTouchPoints > 0 }
    }
    function connect() {
        ws = new WebSocket(wsUrl)
        ws.binaryType = "blob"
        ws.onopen = () => {
            open = true
            reconnectDelay = 500
            send(viewportMsg("hello"))
            renderStatus()
        }
        ws.onmessage = ev => {
            if (typeof ev.data === "string") {
                try {
                    const msg = JSON.parse(ev.data)
                    if (msg.t === "state") { remoteState = msg; renderStatus() }
                } catch {}
                return
            }
            latestBlob = ev.data
            void drawLoop()
        }
        ws.onclose = ev => {
            open = false
            renderStatus()
            if (ev.code === 4403) { banner.textContent = "forbidden: wrong or missing token"; return }
            setTimeout(connect, reconnectDelay)
            reconnectDelay = Math.min(5000, reconnectDelay * 2)
        }
        ws.onerror = () => { try { ws.close() } catch {} }
    }
    connect()

    let resizeTimer = null
    function onViewportChange() {
        fitCanvas()
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(() => send(viewportMsg("resize")), 150)
    }
    window.addEventListener("resize", onViewportChange)
    window.addEventListener("orientationchange", onViewportChange)
    // Mobile toolbars showing/hiding change innerHeight without always firing window resize.
    window.visualViewport?.addEventListener("resize", onViewportChange)

    // ── pointer input ──
    function pos(e) {
        const r = canvas.getBoundingClientRect()
        const x = Math.max(0, Math.min(r.width, e.clientX - r.left))
        const y = Math.max(0, Math.min(r.height, e.clientY - r.top))
        return { x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100 }
    }
    // Touch is handled through the Touch Events API, not Pointer Events: a touch event carries
    // the FULL active-touch list (exactly what CDP Input.dispatchTouchEvent wants), and its
    // preventDefault is what reliably stops iOS Safari / Android from turning two fingers into
    // a page pinch-zoom (which would pointercancel the gesture out from under us). Points are
    // forwarded raw, so the app's own PinchZoomController / pointer orbit run unchanged.
    const touchIds = new Map() // Touch.identifier (huge on iOS) → small CDP id
    function touchId(identifier) {
        let id = touchIds.get(identifier)
        if (id == null) { id = 0; const used = new Set(touchIds.values()); while (used.has(id)) id++; touchIds.set(identifier, id) }
        return id
    }
    function sendTouch(type, e) {
        const r = canvas.getBoundingClientRect()
        const pts = [...e.touches].map(t => ({
            id: touchId(t.identifier),
            x: Math.round(Math.max(0, Math.min(r.width, t.clientX - r.left)) * 100) / 100,
            y: Math.round(Math.max(0, Math.min(r.height, t.clientY - r.top)) * 100) / 100,
        }))
        const live = new Set(pts.map(p => p.id))
        for (const [ident, id] of touchIds) if (!live.has(id)) touchIds.delete(ident)
        if (activeTouches !== pts.length) { activeTouches = pts.length; renderStatus() }
        send({ t: "tc", type, pts })
    }
    canvas.addEventListener("touchstart", e => { e.preventDefault(); pokeHud(); canvas.focus({ preventScroll: true }); sendTouch("touchStart", e) }, { passive: false })
    canvas.addEventListener("touchmove", e => { e.preventDefault(); sendTouch("touchMove", e) }, { passive: false })
    canvas.addEventListener("touchend", e => { e.preventDefault(); sendTouch("touchEnd", e) }, { passive: false })
    canvas.addEventListener("touchcancel", e => { sendTouch("touchCancel", e) }, { passive: false })

    canvas.addEventListener("pointerdown", e => {
        if (e.pointerType === "touch") return
        pokeHud()
        canvas.focus({ preventScroll: true })
        e.preventDefault()
        canvas.setPointerCapture(e.pointerId)
        send({ t: "md", ...pos(e), b: e.button === 1 ? 1 : e.button === 2 ? 2 : 0 })
    })
    canvas.addEventListener("pointermove", e => {
        if (e.pointerType === "touch") return
        send({ t: "mm", ...pos(e) })
    })
    function pointerEnd(e) {
        if (e.pointerType === "touch") return
        send({ t: "mu", ...pos(e), b: e.button === 1 ? 1 : e.button === 2 ? 2 : 0 })
    }
    canvas.addEventListener("pointerup", pointerEnd)
    canvas.addEventListener("pointercancel", pointerEnd)
    canvas.addEventListener("contextmenu", e => e.preventDefault())
    canvas.addEventListener("wheel", e => {
        e.preventDefault()
        const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1
        send({ t: "wh", ...pos(e), dx: e.deltaX * k, dy: e.deltaY * k })
    }, { passive: false })

    // ── keyboard input ──
    // Physical keyboards: forward key names (Puppeteer maps them to CDP key events). Virtual/IME
    // keyboards report "Unidentified"/"Process" on keydown; those are handled via the input event.
    const MODS = ["Shift", "Control", "Alt", "Meta"]
    function onKey(e, t) {
        if (e.isComposing || e.key === "Unidentified" || e.key === "Process" || e.key === "Dead") return
        e.preventDefault()
        pokeHud()
        send({ t, key: e.key })
    }
    for (const el of [canvas, kb]) {
        el.addEventListener("keydown", e => onKey(e, "kd"))
        el.addEventListener("keyup", e => onKey(e, "ku"))
    }
    kb.addEventListener("input", e => {
        if (e.isComposing) return
        if (e.inputType === "insertText" || e.inputType === "insertCompositionText") {
            if (e.data) send({ t: "txt", text: e.data })
        } else if (e.inputType === "deleteContentBackward") {
            send({ t: "kd", key: "Backspace" }); send({ t: "ku", key: "Backspace" })
        } else if (e.inputType === "insertLineBreak" || e.inputType === "insertParagraph") {
            send({ t: "kd", key: "Enter" }); send({ t: "ku", key: "Enter" })
        }
        kb.value = ""
    })
    kb.addEventListener("compositionend", e => { if (e.data) send({ t: "txt", text: e.data }); kb.value = "" })
    // Losing focus/visibility mid-gesture would otherwise strand a held modifier or button
    // in the remote tab (the matching up event never arrives).
    function releaseAll() {
        for (const m of MODS) send({ t: "ku", key: m })
        send({ t: "release" })
        touchIds.clear(); activeTouches = 0
    }
    window.addEventListener("blur", releaseAll)
    document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll() })

    // ── hud buttons ──
    document.getElementById("btnKb").addEventListener("click", () => { kb.focus(); pokeHud() })
    btnHidpi.addEventListener("click", () => {
        hidpi = !hidpi
        btnHidpi.classList.toggle("on", hidpi)
        try { localStorage.setItem("gcad_remote_hidpi", hidpi ? "1" : "0") } catch {}
        send(viewportMsg("resize"))
        pokeHud()
    })
    document.getElementById("btnReload").addEventListener("click", () => { send({ t: "reload" }); pokeHud() })
    document.getElementById("btnFs").addEventListener("click", () => {
        if (document.fullscreenElement) document.exitFullscreen?.()
        else document.documentElement.requestFullscreen?.()
        pokeHud()
    })
    hud.addEventListener("pointerenter", pokeHud)
    canvas.focus({ preventScroll: true })
})()
</script>
</body>
</html>
