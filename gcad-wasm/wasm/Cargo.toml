[package]
name = "gcad-wasm"
version.workspace = true
edition.workspace = true

[lib]
# cdylib → the .wasm artifact; rlib → lets native tests/tools link this crate too.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The wasm boundary needs the kernel's JSON scene-bridge ingestion (serde feature).
gcad-kernel = { path = "../kernel", features = ["serde"] }
wasm-bindgen = "0.2"
# Date.now() as the injected pipeline clock for phase-timing (export_sfcc).
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
