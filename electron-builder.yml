appId: app.galacticad
productName: GalactiCAD

# Everything generated/used by electron-builder lives under dist/:
#   dist/build    — buildResources (icons rendered from src/assets/gicon.svg
#                   by `make icons`)
#   dist/release  — packaged installers/archives
# Source-only electron files (main.mjs, preload.cjs, entitlements.plist) stay
# in electron/.
directories:
  buildResources: dist/build
  output: dist/release

# Include only what the runtime needs:
#   dist/site  — the built web app loaded over app://galacticad
#   electron/  — main + preload + entitlements
# node_modules is pruned to production by default, but the app itself has no
# runtime node deps so the bundle stays small either way. dist/build and
# dist/release are deliberately excluded.
files:
  - "electron/**"
  - "dist/site/**"
  - "package.json"

asar: true

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Sign with the Developer ID Application cert in the login keychain.
  # Hardened runtime + entitlements are required for notarization; the same
  # entitlements must be inherited by Electron's helper apps or the renderer
  # will be killed for using JIT.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  # Notarize via @electron/notarize using credentials from env:
  #   APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
  # (or APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER for CI).
  # Skip signing + notarization locally with CSC_IDENTITY_AUTO_DISCOVERY=false.
  notarize: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

linux:
  category: Graphics
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
