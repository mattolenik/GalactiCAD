<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Cube wireframe with one vertex (corner) emphasized -->
  <g stroke-opacity="0.35" stroke-width="1">
    <polygon points="9,3 15,7 9,10 3,7"/>
    <line x1="15" y1="7" x2="15" y2="14"/>
    <line x1="15" y1="14" x2="9" y2="17"/>
    <line x1="9" y1="17" x2="3" y2="14"/>
    <line x1="3" y1="14" x2="3" y2="7"/>
    <line x1="9" y1="10" x2="9" y2="17"/>
  </g>
  <!-- Emphasized corner vertex: front-right-top -->
  <circle cx="15" cy="7" r="2.4" fill="currentColor" stroke="none"/>
</svg>
