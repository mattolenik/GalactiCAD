<!doctype html>
<html>
    <head>
        <title>GalactiCAD</title>
        <meta charset="UTF-8" />
        <meta name="description" content="The first new hybrid CAD-as-code suite" />
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1" />
        <meta name="theme-color" content="#333333" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
        <link rel="icon" href="/assets/gicon.svg" type="image/svg+xml" />
        <link rel="manifest" href="/site.webmanifest" />
        <link rel="stylesheet" href="/index.css" />
    </head>

    <body>
        <div id="workspace">
            <div id="toolbar">
                <div id="tabs"></div>
                <div id="menuButton"></div>
            </div>
            <div id="main-panels">
                <div id="editor">
                    <div id="log"></div>
                </div>
                <div id="resize-handle" role="separator" aria-orientation="horizontal"></div>
                <div id="viewports">
                    <preview-window id="preview"></preview-window>
                </div>
            </div>
        </div>
        <script type="module" src="./components/preview-window.js"></script>
        <script type="module">
            import App from "./app.js"
            const editor = document.getElementById("editor")
            editor.classList.add("visible")
            const font = new FontFace("FiraCode", 'url(/assets/firacode-vf.woff2) format("woff2")')
            font.load().then(() => {
                document.fonts.add(font)
                const app = new App(
                    document.getElementById("preview"),
                    document.getElementById("tabs"),
                    editor,
                    document.getElementById("log"),
                    document.getElementById("menuButton"),
                )
            })
        </script>
    </body>
</html>
