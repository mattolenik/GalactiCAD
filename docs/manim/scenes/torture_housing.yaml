# gcad scene source for docs/manim/assets/torture_housing.png (+ _mesh / _mesh_solid variants).
# Regenerate: scripts/agentcli render --yaml docs/manim/scenes/torture_housing.yaml --mode sdf   (or --mode mesh)
schemaVersion: 1
source: |-
  // Torture housing: tee pipes + loft flange + cone port + hollowing + dent + flat base
  let barrel = cylinder.radius(8).height(19).shift(0, 0, 0).rotate(90, 0, 0)
  let branch = cylinder.radius(6.5).height(12).shift(0, 8, 0)
  let tee = union(barrel, branch).round(3.5)
  let sq = polygon2d([-10, -10], [10, -10], [10, 10], [-10, 10])
  let ring = polygon2d(
    [8.8, 0], [7.62, 4.4], [4.4, 7.62], [0, 8.8], [-4.4, 7.62], [-7.62, 4.4],
    [-8.8, 0], [-7.62, -4.4], [-4.4, -7.62], [0, -8.8], [4.4, -7.62], [7.62, -4.4])
  let flange = loft.sections(sq, ring).height(3).shift(0, 0, 0).rotate(-90, 0, 0)
  let flangeZ = translate(0, 0, 16, flange)
  let withFlange = union(tee, flangeZ)
  let port = cone.radius(9).height(7).shift(0, 19.5, 0)
  let ported = union(withFlange, port).chamfer(1.5)
  let boreMain = cylinder.radius(5.5).height(22).shift(0, 0, 0).rotate(90, 0, 0)
  let boreBranch = cylinder.radius(4).height(15).shift(0, 12, 0)
  let holeA = translate(7.5, 7.5, 16, rotate(90, 0, 0, cylinder.radius(1.4).height(4)))
  let holeB = translate(-7.5, 7.5, 16, rotate(90, 0, 0, cylinder.radius(1.4).height(4)))
  let holeC = translate(7.5, -7.5, 16, rotate(90, 0, 0, cylinder.radius(1.4).height(4)))
  let holeD = translate(-7.5, -7.5, 16, rotate(90, 0, 0, cylinder.radius(1.4).height(4)))
  let hollowed = subtract(ported, boreMain, boreBranch, holeA, holeB, holeC, holeD)
  let dent = sphere.radius(4.5).shift(8.2, 1, 8)
  let dented = subtract(hollowed, dent)
  let base = box(30, 30, 30).shift(0, 22.6, 0)
  return intersect(dented, base)
camera:
  position: [0, 0, 1]
  translation: [1, 3, 0]
  dollyDistance: 32
  rotation: [0.881411388237, 0.280449078075, 0.360577386097, 0.120192462032]
  pivot: [0, 0, 0]
viewCenter: [0.5, 0.5]
resolutionScale: 1
viewportWidth: 1200
viewportHeight: 1000
meshExport:
  simplifyOnExport: false
  exporter: sfcc
