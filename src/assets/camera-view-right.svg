<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Full wireframe cube; right face highlighted (TFR-TBR-BBR-BFR) -->
  <polygon points="11,10.5 21,6.5 21,17.5 11,21.5" fill="#e6b800" stroke="none"/>
  <!-- Solid edges -->
  <line x1="1"  y1="6.5"  x2="11" y2="10.5"/>
  <line x1="11" y1="10.5" x2="21" y2="6.5"/>
  <line x1="21" y1="6.5"  x2="11" y2="2.5"/>
  <line x1="11" y1="2.5"  x2="1"  y2="6.5"/>
  <line x1="1"  y1="6.5"  x2="1"  y2="17.5"/>
  <line x1="11" y1="10.5" x2="11" y2="21.5"/>
  <line x1="21" y1="6.5"  x2="21" y2="17.5"/>
  <line x1="1"  y1="17.5" x2="11" y2="21.5"/>
  <line x1="11" y1="21.5" x2="21" y2="17.5"/>
  <!-- Dashed edges (hidden faces) -->
  <line x1="11" y1="2.5"  x2="11" y2="13.5" stroke-dasharray="1.5,1.5" stroke-opacity="0.4"/>
  <line x1="21" y1="17.5" x2="11" y2="13.5" stroke-dasharray="1.5,1.5" stroke-opacity="0.4"/>
  <line x1="11" y1="13.5" x2="1"  y2="17.5" stroke-dasharray="1.5,1.5" stroke-opacity="0.4"/>
</svg>
